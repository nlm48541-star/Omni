name: 1-Hour OmniSync Bot

on:
  schedule:
    # এটি ঠিক ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে গিটহাবে রান করবে
    - cron: '0 * * * *'  
  workflow_dispatch: # যখন ইচ্ছে ম্যানুয়ালি বোতাম চেপে রান করার অপশন

permissions:
  contents: write    # bot_memory.json এ হিসেব লিখে সেভ করার পারমিশন 

jobs:
  omni-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Fetch Private Source Code
        uses: actions/checkout@v4
        
      - name: Set up Python Engine
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Missing Libraries
        run: pip install -r requirements.txt

      - name: 🔥 Execute The Engine Run
        run: python run_on_github.py

      - name: Commit New History state (So it doesn't double post)
        run: |
          git config --local user.email "bot@omnisync.io"
          git config --local user.name "OmniSync System"
          git add bot_memory.json
          git commit -m "Updated Sync Checkpoints Memory [skip-ci]" || echo "No fresh syncs/updates to save"
          git push