name: Fixed 1-Hour OmniSync Bot

on:
  workflow_dispatch:          # গিটহাব ড্যাশবোর্ড থেকে ম্যানুয়ালি রান করার বাটন
  repository_dispatch:        # cron-job.org থেকে রিমোট ট্রিগার
    types: [run-sync]

permissions:
  contents: write

jobs:
  run-sync-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Node.js সেটআপ (TikTokAutoUploader এর জন্য প্রযোজ্য)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # রানারে ffmpeg এবং ffprobe ইনস্টল করার ধাপ
      - name: Install FFmpeg & FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # প্রয়োজনীয় প্যাকেজ এবং Phantomwright (TikTokAutoUploader স্টিলথ ব্রাউজার) ইনস্টল করার ধাপ
      - name: Install Requirements & Phantomwright Drivers
        run: |
          pip install -r requirements.txt
          phantomwright_driver install chromium || true
          playwright install --with-deps chromium

      # সিক্রেটগুলো এনভায়রনমেন্ট ভ্যারিয়েবল হিসেবে পাস করার ধাপ
      - name: Execute OmniSync Master Engine
        env:
          YT_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: python run_on_github.py

      - name: Commit & Save Sync Progress State
        run: |
          git config --local user.email "engine@omnisync.io"
          git config --local user.name "OmniSync Master Engine"
          git add bot_memory.json
          git commit -m "Auto-Update: Visual & Multi-Output checkpoint [skip-ci]" || echo "No new updates to save"
          git push
