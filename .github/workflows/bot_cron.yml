name: Fixed 1-Hour OmniSync Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-sync]

permissions:
  contents: write

jobs:
  run-sync-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg & FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          pip install -r requirements.txt

      - name: Setup TikTok Direct API Engine (makiisthenes)
        run: |
          git clone https://github.com/makiisthenes/TiktokAutoUploader.git tiktok_engine
          cd tiktok_engine
          pip install -r requirements.txt || true
          if [ -d "tiktok_uploader/tiktok-signature" ]; then
            cd tiktok_uploader/tiktok-signature && npm install && cd ../..
          elif [ -d "tiktok-signature" ]; then
            cd tiktok-signature && npm install && cd ..
          fi
          mkdir -p CookiesDir

      - name: Execute OmniSync Master Engine
        env:
          YT_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: python run_on_github.py

      - name: Commit & Save Sync Progress State
        run: |
          git config --local user.email "engine@omnisync.io"
          git config --local user.name "OmniSync Master Engine"
          git add bot_memory.json
          git commit -m "Auto-Update: Visual & Multi-Output checkpoint [skip-ci]" || echo "No new updates to save"
          git push
