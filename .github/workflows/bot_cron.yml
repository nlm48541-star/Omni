name: Fixed 1-Hour OmniSync Bot

on:
  schedule:
    - cron: '0 * * * *'  # Runs exactly once every 1 hour (24/7)
  workflow_dispatch:      # Manual run button

permissions:
  contents: write

jobs:
  run-sync-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          pip install telethon requests feedparser

      - name: Execute OmniSync Master Engine
        run: python run_on_github.py

      - name: Commit & Save Sync Progress State
        run: |
          git config --local user.email "engine@omnisync.io"
          git config --local user.name "OmniSync Master Engine"
          git add bot_memory.json
          git commit -m "Auto-Update: Visual & Multi-Output checkpoint [skip-ci]" || echo "No new updates to save"
          git push
