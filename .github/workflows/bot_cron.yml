name: Fixed 1-Hour OmniSync Bot

on:
  workflow_dispatch:          # গিটহাব ড্যাশবোর্ড থেকে ম্যানুয়ালি রান করার বাটন সচল রাখবে
  repository_dispatch:        # cron-job.org থেকে রিমোট ট্রিগার সচল রাখবে
    types: [run-sync]

permissions:
  contents: write

jobs:
  run-sync-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # রানারে ffmpeg এবং ffprobe ইনস্টল করার ধাপ
      - name: Install FFmpeg & FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Requirements
        run: |
          pip install telethon requests feedparser "yt-dlp[default]" quickjs beautifulsoup4 Pillow

      - name: Execute OmniSync Master Engine
        run: python run_on_github.py

      # Rclone কনফিগারেশন এবং রানারে সেভ করার ধাপ (সিঙ্গেল কোট দিয়ে টোকেন রিডিং সুরক্ষিত করা হয়েছে)
      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          cat <<'EOF' > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.RCLONE_TOKEN }}
          EOF

      # reels_output ফোল্ডারে নতুন তৈরি হওয়া ভিডিওগুলো ড্রাইভে আপলোড করার ধাপ
      - name: Upload Reels to Google Drive
        run: |
          if [ -d "reels_output" ] && [ "$(ls -A reels_output)" ]; then
            echo "Uploading compiled Reels to Google Drive..."
            rclone copy reels_output/ gdrive:${{ secrets.GDRIVE_FOLDER_ID }} --verbose
          else
            echo "No new compiled Reels found in reels_output folder."
          fi

      - name: Commit & Save Sync Progress State
        run: |
          git config --local user.email "engine@omnisync.io"
          git config --local user.name "OmniSync Master Engine"
          git add bot_memory.json
          git commit -m "Auto-Update: Visual & Multi-Output checkpoint [skip-ci]" || echo "No new updates to save"
          git push
