name: OmniSync Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-sync]

permissions:
  contents: write

jobs:
  run-sync-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies, Fonts & Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm-dev fonts-beng rclone

      - name: Install Python Requirements
        run: |
          pip install -r requirements.txt

      - name: Execute OmniSync Master Engine
        env:
          CI: "true"
          DEBIAN_FRONTEND: "noninteractive"
          PYTHONUNBUFFERED: "1"

          # টেলিগ্রাম সেটিংস
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}

          # ফেসবুক ও হোয়াটসঅ্যাপ সেটিংস
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          RENDER_WA_URL: ${{ secrets.RENDER_WA_URL }}

          # 🌟 YouTube মাল্টি-চ্যানেল সেটিংস (যে কোনো নামের ফরম্যাট সাপোর্ট করবে)
          YT_CLIENT_ID_1: ${{ secrets.YT_CLIENT_ID_1 || secrets.CLIENT_ID_1 || secrets.YT_CLIENT_ID || secrets.CLIENT_ID }}
          YT_CLIENT_SECRET_1: ${{ secrets.YT_CLIENT_SECRET_1 || secrets.CLIENT_SECRET_1 || secrets.YT_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YT_REFRESH_TOKEN_1: ${{ secrets.YT_REFRESH_TOKEN_1 || secrets.REFRESH_TOKEN_1 || secrets.YT_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}

          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || secrets.CLIENT_ID || secrets.YT_CLIENT_ID_1 || secrets.CLIENT_ID_1 }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.CLIENT_SECRET || secrets.YT_CLIENT_SECRET_1 || secrets.CLIENT_SECRET_1 }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN || secrets.REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN_1 || secrets.REFRESH_TOKEN_1 }}

          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 || secrets.CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 || secrets.CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 || secrets.REFRESH_TOKEN_2 }}

          YT_CLIENT_ID_3: ${{ secrets.YT_CLIENT_ID_3 || secrets.CLIENT_ID_3 }}
          YT_CLIENT_SECRET_3: ${{ secrets.YT_CLIENT_SECRET_3 || secrets.CLIENT_SECRET_3 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 || secrets.REFRESH_TOKEN_3 }}

          YT_CLIENT_ID_4: ${{ secrets.YT_CLIENT_ID_4 || secrets.CLIENT_ID_4 }}
          YT_CLIENT_SECRET_4: ${{ secrets.YT_CLIENT_SECRET_4 || secrets.CLIENT_SECRET_4 }}
          YT_REFRESH_TOKEN_4: ${{ secrets.YT_REFRESH_TOKEN_4 || secrets.REFRESH_TOKEN_4 }}

          YT_CLIENT_ID_5: ${{ secrets.YT_CLIENT_ID_5 || secrets.CLIENT_ID_5 }}
          YT_CLIENT_SECRET_5: ${{ secrets.YT_CLIENT_SECRET_5 || secrets.CLIENT_SECRET_5 }}
          YT_REFRESH_TOKEN_5: ${{ secrets.YT_REFRESH_TOKEN_5 || secrets.REFRESH_TOKEN_5 }}

          YT_CLIENT_ID_6: ${{ secrets.YT_CLIENT_6 || secrets.CLIENT_ID_6 }}
          YT_CLIENT_SECRET_6: ${{ secrets.YT_CLIENT_SECRET_6 || secrets.CLIENT_SECRET_6 }}
          YT_REFRESH_TOKEN_6: ${{ secrets.REFRESH_TOKEN_6 || secrets.YT_REFRESH_TOKEN_6 }}

          YT_CLIENT_ID_7: ${{ secrets.YT_CLIENT_ID_7 || secrets.CLIENT_ID_7 }}
          YT_CLIENT_SECRET_7: ${{ secrets.YT_CLIENT_SECRET_7 || secrets.CLIENT_SECRET_7 }}
          YT_REFRESH_TOKEN_7: ${{ secrets.REFRESH_TOKEN_7 || secrets.YT_REFRESH_TOKEN_7 }}

          YT_CLIENT_ID_8: ${{ secrets.YT_CLIENT_ID_8 || secrets.CLIENT_ID_8 }}
          YT_CLIENT_SECRET_8: ${{ secrets.YT_CLIENT_SECRET_8 || secrets.CLIENT_SECRET_8 }}
          YT_REFRESH_TOKEN_8: ${{ secrets.REFRESH_TOKEN_8 || secrets.YT_REFRESH_TOKEN_8 }}

          # TikTok / Buffer ৩টি অ্যাকাউন্ট ও মাল্টি-প্রোফাইল সেটিংস
          BUFFER_TOKEN_1: ${{ secrets.BUFFER_TOKEN_1 }}
          BUFFER_PROFILES_1: ${{ secrets.BUFFER_PROFILES_1 }}
          BUFFER_TOKEN_2: ${{ secrets.BUFFER_TOKEN_2 }}
          BUFFER_PROFILES_2: ${{ secrets.BUFFER_PROFILES_2 }}
          BUFFER_TOKEN_3: ${{ secrets.BUFFER_TOKEN_3 }}
          BUFFER_PROFILES_3: ${{ secrets.BUFFER_PROFILES_3 }}
          BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}

          # টেক্সট এআই প্ল্যাটফর্মসমূহ
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API: ${{ secrets.GROQ_API }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OLLAMA_API_KEYS: ${{ secrets.OLLAMA_API_KEYS }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_API_URL: ${{ secrets.OLLAMA_API_URL }}

          # ভয়েস এআই প্ল্যাটফর্মসমূহ (Gemini ও ElevenLabs)
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE_ID: ${{ secrets.GEMINI_VOICE_ID }}
          GEMINI_DELIVERY_STYLE: ${{ secrets.GEMINI_DELIVERY_STYLE }}
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          # Rclone এবং Google Drive সেটিংস
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_BG_FOLDER_ID: ${{ secrets.GDRIVE_BG_FOLDER_ID }}
          SAVE_TO_GDRIVE: ${{ secrets.SAVE_TO_GDRIVE }}
          ENABLE_TIKTOK: ${{ secrets.ENABLE_TIKTOK }}
          USE_LOCAL_MUSIC: ${{ secrets.USE_LOCAL_MUSIC }}
        run: python -u run_on_github.py

      # মেমোরি স্টেট অটোমেটিক গিটহাবে সেভ
      - name: Commit & Save Sync Progress State
        run: |
          git config --local user.email "engine@omnisync.io"
          git config --local user.name "OmniSync Master Engine"
          git add bot_memory.json key_tracker.json || true
          git commit -m "Auto-Update: Save memory & key tracker [skip-ci]" || echo "No new updates to save"
          git push
